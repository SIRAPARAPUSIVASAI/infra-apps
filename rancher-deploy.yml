version: "3.9"

services:
  rancher:
    image: rancher/rancher:latest
    container_name: rancher
    restart: unless-stopped
    privileged: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/rancher-data:/var/lib/rancher   # Host directory mounted to container
    environment:
      - CATTLE_BOOTSTRAP_PASSWORD=Admin@123   # Initial admin password